services:
    postgres:
        image: postgres:16
        container_name: simple-postgres
        restart: unless-stopped

        environment:
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile

        container_name: hitbloq-backend
        restart: unless-stopped

        ports:
            - "3001:3001"

        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
            API_KEY_ENCRYPTION_KEY_BASE64: ${API_KEY_ENCRYPTION_KEY_BASE64:?API_KEY_ENCRYPTION_KEY_BASE64 must be set}

        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data: