server.port=3001
spring.application.name=hitbloq-spring-proxy

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop

app.api-key-crypto.key-base64=${API_KEY_ENCRYPTION_KEY_BASE64:}
app.api-key-crypto.key-file=${API_KEY_ENCRYPTION_KEY_FILE:}
app.api-key-crypto.key-version=${API_KEY_ENCRYPTION_KEY_VERSION:1}


app.test-data.enabled=true
app.cache.enabled=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
