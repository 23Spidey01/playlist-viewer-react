spring.datasource.url=jdbc:h2:mem:security;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.docker.compose.enabled=false
app.test-data.enabled=false
# Test-only key for the isolated in-memory database.
app.api-key-crypto.key-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.api-key-crypto.key-file=
app.cors.allowed-origins=https://frontend.example.com
app.auth-rate-limit.login-per-ip=1000
app.auth-rate-limit.login-per-account=1000
app.auth-rate-limit.registration-per-ip=1000
app.auth-rate-limit.changes-per-ip=1000
app.auth-rate-limit.changes-per-account=1000
